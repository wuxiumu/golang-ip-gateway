name: smoke

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build -o /tmp/ip-gateway .
