# 宝塔部署 nginx 反代配置示例
# 用法一：宝塔面板 → 网站 → 设置 → 反向代理 生成配置后，把缺的 proxy_set_header 行补进站点配置
# 用法二：直接把本文件复制为 /www/server/panel/vhost/nginx/ipgateway.conf（改 server_name）后 nginx -s reload
#
# ⚠️ 关键：X-Forwarded-For 必须传递，网关靠它拿真实客户端 IP 做分流；
#    同时网关 config.yaml 的 trusted_proxies 必须包含 127.0.0.1（默认已包含）。
# 端口：这里的 8080 是 doc/04 线上 listen。仓库自带 config.yaml / Docker 示例是 :18080，不要混用。

server {
    listen 80;
    server_name gw.example.com;   # 改成你的域名，或服务器公网 IP

    access_log /www/wwwlogs/ipgateway.log;

    # 整站即网关：所有路径全部转发
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # ★ 分流依据，不能少
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # 可选（本期不考虑安全，保持注释即可）：如以后想限制管理接口仅内网访问，取消注释
    # location ^~ /admin/ {
    #     allow 127.0.0.1;
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
